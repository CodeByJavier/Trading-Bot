name: Controlar el bot

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "¿Qué quieres hacer?"
        type: choice
        required: true
        options:
          - pausar
          - reanudar
          - vender_y_pausar
          - cambiar_umbrales
          - reiniciar_simulacion
      umbral_compra:
        description: "Solo para cambiar_umbrales: nuevo umbral de compra entre 0 y 1 (ej. 0.60). Vacío = sin cambios"
        required: false
        default: ""
      umbral_venta:
        description: "Solo para cambiar_umbrales: nuevo umbral de venta entre 0 y 1 (ej. 0.45). Vacío = sin cambios"
        required: false
        default: ""
      capital:
        description: "Solo para reiniciar_simulacion: euros ficticios (ej. 200). Vacío = sin cambios"
        required: false
        default: ""
      simbolo:
        description: "Solo para reiniciar_simulacion: moneda en euros (ej. BTCEUR, ETHEUR). Vacío = sin cambios"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TZ: Europe/Madrid

jobs:
  controlar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: bot-estado        # la misma cola que el bot: nunca guardan a la vez
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main              # el estado MÁS RECIENTE

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Aplicar la acción
        env:
          ACCION: ${{ inputs.accion }}
          UMBRAL_COMPRA: ${{ inputs.umbral_compra }}
          UMBRAL_VENTA: ${{ inputs.umbral_venta }}
          CAPITAL: ${{ inputs.capital }}
          SIMBOLO: ${{ inputs.simbolo }}
        run: >
          python control.py "$ACCION"
          --umbral-compra "$UMBRAL_COMPRA" --umbral-venta "$UMBRAL_VENTA"
          --capital "$CAPITAL" --simbolo "$SIMBOLO"

      - name: Guardar estado en el repositorio
        env:
          ACCION: ${{ inputs.accion }}
        run: |
          bash .github/guardar.sh "Control: $ACCION" datos_bot docs INFORME_APRENDIZAJE.md ajustes.json

  publicar:
    needs: controlar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: bot-web
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url || steps.reintento.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: despliegue
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Esperar antes de reintentar
        if: steps.despliegue.outcome == 'failure'
        run: sleep 60
      - id: reintento
        if: steps.despliegue.outcome == 'failure'
        uses: actions/deploy-pages@v4
