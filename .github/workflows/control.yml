name: Controlar el bot

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "¿Qué quieres hacer?"
        type: choice
        required: true
        options:
          - pausar
          - reanudar
          - vender_y_pausar
          - cambiar_umbrales
          - reiniciar_simulacion
      umbral_compra:
        description: "Solo para cambiar_umbrales: nuevo umbral de compra entre 0 y 1 (ej. 0.60). Vacío = sin cambios"
        required: false
        default: ""
      umbral_venta:
        description: "Solo para cambiar_umbrales: nuevo umbral de venta entre 0 y 1 (ej. 0.45). Vacío = sin cambios"
        required: false
        default: ""
      capital:
        description: "Solo para reiniciar_simulacion: euros ficticios (ej. 200). Vacío = sin cambios"
        required: false
        default: ""
      simbolo:
        description: "Solo para reiniciar_simulacion: moneda en euros (ej. BTCEUR, ETHEUR). Vacío = sin cambios"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bot-trading
  cancel-in-progress: false

env:
  TZ: Europe/Madrid

jobs:
  controlar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Aplicar la acción
        env:
          ACCION: ${{ inputs.accion }}
          UMBRAL_COMPRA: ${{ inputs.umbral_compra }}
          UMBRAL_VENTA: ${{ inputs.umbral_venta }}
          CAPITAL: ${{ inputs.capital }}
          SIMBOLO: ${{ inputs.simbolo }}
        run: >
          python control.py "$ACCION"
          --umbral-compra "$UMBRAL_COMPRA" --umbral-venta "$UMBRAL_VENTA"
          --capital "$CAPITAL" --simbolo "$SIMBOLO"

      - name: Guardar estado en el repositorio
        env:
          ACCION: ${{ inputs.accion }}
        run: |
          git config user.name "bot-trading"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos_bot docs
          if [ -f ajustes.json ]; then git add ajustes.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Control: $ACCION"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: despliegue
        uses: actions/deploy-pages@v4
