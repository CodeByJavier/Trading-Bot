name: Bot cada hora

on:
  schedule:
    # Respaldo por si falla el despertador externo (cron-job.org). GitHub a veces se los salta.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:       # botón "Run workflow" y el despertador externo de cron-job.org

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TZ: Europe/Madrid

jobs:
  # 1) Calcular y guardar. No depende de la web: si publicar falla, esto sigue funcionando.
  ejecutar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: bot-estado        # una sola a la vez, para que no se pisen al guardar
      cancel-in-progress: false
    outputs:
      cambios: ${{ steps.guardar.outputs.cambios }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main              # el estado MÁS RECIENTE (no el del momento en que se lanzó)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Procesar velas nuevas
        run: python bot.py --una-vez

      - name: Red neuronal multimercado (simulación aparte)
        continue-on-error: true   # si falla, el bot principal sigue funcionando igual
        run: python bot_red.py --una-vez

      - name: Guardar estado en el repositorio
        id: guardar
        run: bash .github/guardar.sh "Bot: vela procesada" datos_bot docs INFORME_APRENDIZAJE.md datos_red INFORME_RED.md

  # 2) Publicar la web, solo si hubo cambios. Si GitHub la rechaza, espera y lo reintenta una vez.
  publicar:
    needs: ejecutar
    if: needs.ejecutar.outputs.cambios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: bot-web
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url || steps.reintento.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main              # la versión recién guardada
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: despliegue
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Esperar antes de reintentar
        if: steps.despliegue.outcome == 'failure'
        run: sleep 60
      - id: reintento
        if: steps.despliegue.outcome == 'failure'
        uses: actions/deploy-pages@v4
